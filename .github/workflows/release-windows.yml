name: Windows Release

run-name: Windows Release ${{ inputs.version && format('v{0}', inputs.version) || github.ref_name }}

on:
  push:
    branches: [main]
    paths: [package.json]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version in package.json (for example 0.1.0, without v)'
        required: true
        type: string
      prerelease:
        description: 'Mark the draft as a pre-release'
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  resolve:
    name: Resolve the release version
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Compare or validate package.json version
        id: version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE_SHA: ${{ github.event.before }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          function Read-PackageVersion([string]$Commit) {
            $manifest = gh api --method GET "repos/$env:GITHUB_REPOSITORY/contents/package.json" `
              --header 'Accept: application/vnd.github.raw+json' -f "ref=$Commit"
            if ($LASTEXITCODE -ne 0) { throw "Could not read package.json at $Commit." }
            ($manifest | ConvertFrom-Json).version
          }

          if ($env:GITHUB_EVENT_NAME -eq 'push' -and $env:BEFORE_SHA -match '\A0{40}\z') {
            Write-Output 'No previous main commit; use Run workflow to build the initial version.'
            exit 0
          }

          $version = Read-PackageVersion $env:GITHUB_SHA
          if ($version -isnot [string] -or $version -cnotmatch '\A(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\z') {
            throw 'The version in package.json must use X.Y.Z format without a v prefix.'
          }

          if ($env:GITHUB_EVENT_NAME -eq 'push') {
            $previousVersion = Read-PackageVersion $env:BEFORE_SHA
            if ($version -ceq $previousVersion) {
              Write-Output "package.json version is unchanged ($version); skipping the installer build."
              exit 0
            }
            Write-Output "package.json version changed from $previousVersion to $version."
          } elseif ($env:REQUESTED_VERSION -cne $version) {
            throw "Requested version does not match package.json ($version). Enter it without a v prefix."
          }

          "version=$version" >> $env:GITHUB_OUTPUT

  build:
    name: Build and test Windows x64
    needs: resolve
    if: needs.resolve.outputs.version != ''
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      VERSION: ${{ needs.resolve.outputs.version }}
      CARGO_TARGET_DIR: ${{ github.workspace }}/desktop/src-tauri/target
      VITEST_MAX_WORKERS: '4'
    steps:
      - name: Preserve repository line endings on Windows
        run: |
          git config --global core.autocrlf false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git config --global core.eol lf
      - name: Check out the selected commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: npm
      - name: Set up the Rust MSVC toolchain
        run: |
          rustup toolchain install stable-x86_64-pc-windows-msvc --profile minimal --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup default stable-x86_64-pc-windows-msvc
      - name: Install dependencies and check the project
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run check
      - name: Build the installer and verify the bundled backend
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File desktop/build.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test desktop/backend.test.mjs desktop/window-bridge.test.mjs
      - name: Collect installer and SHA-256
        run: |
          $filename = "MeGit_${env:VERSION}_x64-setup.exe"
          $installer = Join-Path $env:CARGO_TARGET_DIR "x86_64-pc-windows-msvc/release/bundle/nsis/$filename"
          $assets = New-Item -ItemType Directory -Path release-assets
          Copy-Item -LiteralPath $installer -Destination $assets.FullName
          $hash = (Get-FileHash -LiteralPath (Join-Path $assets.FullName $filename) -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -LiteralPath (Join-Path $assets.FullName 'SHA256.txt') -Value "$hash  $filename" -Encoding ascii -NoNewline
      - name: Save the installer for review
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: windows-x64-v${{ needs.resolve.outputs.version }}
          path: release-assets/
          if-no-files-found: error
          overwrite: true

  draft:
    name: Create an unpublished Release draft
    needs: [resolve, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: windows-release-draft-${{ needs.resolve.outputs.version }}
      cancel-in-progress: false
    steps:
      - name: Retrieve the verified build
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: windows-x64-v${{ needs.resolve.outputs.version }}
          path: release-assets/
      - name: Verify checksum and create draft
        shell: bash
        working-directory: release-assets
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.resolve.outputs.version }}
          PRERELEASE: ${{ github.event_name == 'push' || inputs.prerelease }}
        run: |
          tag="v${VERSION}"
          installer="MeGit_${VERSION}_x64-setup.exe"
          sha256sum --check SHA256.txt
          test -s "$installer"

          releases=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[].tag_name')
          if grep -Fxq -- "$tag" <<< "$releases"; then
            echo "A Release or draft for $tag already exists. Nothing was overwritten." >&2
            exit 1
          fi

          repository="repos/$GITHUB_REPOSITORY"
          tag_ref="refs/tags/$tag"
          existing_ref=$(gh api "$repository/git/matching-refs/tags/$tag" --jq ".[] | select(.ref == \"$tag_ref\") | .ref")
          if [[ -z "$existing_ref" ]]; then
            gh api --method POST "$repository/git/refs" -f "ref=$tag_ref" -f "sha=$GITHUB_SHA" --silent
          else
            tag_sha=$(gh api "$repository/commits/$tag_ref" --jq .sha)
            if [[ "$tag_sha" != "$GITHUB_SHA" ]]; then
              echo "Tag $tag points to $tag_sha, not $GITHUB_SHA. Nothing was overwritten." >&2
              exit 1
            fi
          fi

          options=(--draft --verify-tag --generate-notes --title "MeGit $tag")
          if [[ "$PRERELEASE" == 'true' ]]; then
            options+=(--prerelease)
          fi
          notes=$(printf 'Unsigned Windows x64 installer. Verify with `SHA256.txt` before installing.\n\nSource commit: `%s`.' "$GITHUB_SHA")
          release_url=$(gh release create "$tag" "$installer" SHA256.txt --repo "$GITHUB_REPOSITORY" "${options[@]}" --notes "$notes")
          printf '### [%s Release draft](%s)\n\nReview the installer and notes, then publish manually.\n' "$tag" "$release_url" >> "$GITHUB_STEP_SUMMARY"
